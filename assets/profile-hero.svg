    <rect x="9" y="9" width="158" height="238" rx="20" fill="url(#phone)"/>
    <rect x="60" y="16" width="56" height="5" rx="2.5" fill="#4d7b99"/>
    <circle cx="29" cy="45" r="8" fill="#54ddf2"/>
    <rect x="47" y="39" width="85" height="5" rx="2.5" fill="#d8eaff"/>
    <rect x="47" y="50" width="56" height="4" rx="2" fill="#7292ac"/>
    <rect x="20" y="74" width="136" height="69" rx="12" fill="#24729b"/>
    <path d="M 33 117 L 60 96 82 109 110 84 143 98" fill="none" stroke="#a5eff5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="110" cy="84" r="4" fill="#fff"/>
    <rect x="20" y="157" width="63" height="53" rx="9" fill="#254b68"/>
    <rect x="93" y="157" width="63" height="53" rx="9" fill="#254b68"/>
